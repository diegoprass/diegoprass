name: Template perfil

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar contribuições, estatísticas e projetos
        run: node scripts/code-graph.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          REPOS: skills,Ia-coding-toolkit,framework-5p
          # stack real exibida no card de linguagens (% aproximada; apague a linha para voltar ao cálculo automático)
          LANGS: "Java:40,Groovy:25,JavaScript:20,PL/SQL:10,HTML:3,CSS:2"
          # GitLab opcional (Settings → Secrets and variables → Actions → Variables/Secrets)
          GITLAB_URL: ${{ vars.GITLAB_URL }}
          GITLAB_USER: ${{ vars.GITLAB_USER }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
